# Normalizes the Instagram profile picture of every user-added character into
# the shared avatar style (scripts/avatars/auto.py) and commits the result with
# [skip netlify]: the site serves the new files from GitHub at request time
# (src/app/api/live-asset), so no rebuild is needed.
name: Submission avatars

on:
  push:
    paths:
      - "data/submissions/**"
      - "data/avatars/source/**"
      - "scripts/avatars/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: submission-avatars
  cancel-in-progress: false

jobs:
  avatars:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/avatars/requirements.txt

      - name: Model cache
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: avatar-models-v1

      - name: Install
        run: |
          pip install -r scripts/avatars/requirements.txt
          mkdir -p ~/.u2net
          test -f ~/.u2net/EDSR_x4.pb || curl -sSL -o ~/.u2net/EDSR_x4.pb https://raw.githubusercontent.com/Saafke/EDSR_Tensorflow/master/models/EDSR_x4.pb

      - name: Fetch missing pictures through the site
        # Instagram refuses GitHub's runners; the site fetches pictures with its own
        # Apify key and commits them (POST /api/avatars/backfill/, idempotent)
        continue-on-error: true
        env:
          SITE: ${{ vars.SITE_URL || 'https://aiindexse.netlify.app' }}
        run: |
          curl -s -o /dev/null -w "site check: /tools/avatars/ -> HTTP %{http_code}\n" "$SITE/tools/avatars/" || true
          curl -s -m 30 "$SITE/api/submit/health/" && echo || true
          for i in $(seq 1 10); do
            r=$(curl -s -m 75 -X POST "$SITE/api/avatars/backfill/" || true)
            echo "backfill: $r"
            echo "$r" | grep -q '"remaining"' || break
            echo "$r" | grep -q '"remaining":0' && break
            echo "$r" | grep -q '"added":\[\],"skipped":\[\]' && break
          done
          git pull --rebase --autostash || true

      - name: Normalize avatars
        env:
          # optional repository secret: lets the job fetch a fresh profile picture
          # for submissions that were saved without one
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python scripts/build_data.py
          python scripts/avatars/auto.py --sr-model ~/.u2net/EDSR_x4.pb
          python scripts/build_data.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/avatars scripts/avatars/avatars.json data/avatars/source src/data/generated
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Normalize avatars for user-added characters [skip netlify]"
          # a submission may have landed meanwhile
          git pull --rebase --autostash && git push
