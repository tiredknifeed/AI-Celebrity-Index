# Normalizes the Instagram profile picture of every approved user-added
# character into the shared avatar style (scripts/avatars/auto.py), then
# commits the result; the push triggers the site build.
name: Submission avatars

on:
  push:
    paths:
      - "data/submissions/**"
      - "data/avatars/source/**"
      - "scripts/avatars/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: submission-avatars
  cancel-in-progress: false

jobs:
  avatars:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/avatars/requirements.txt

      - name: Model cache
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: avatar-models-v1

      - name: Install
        run: |
          pip install -r scripts/avatars/requirements.txt
          mkdir -p ~/.u2net
          test -f ~/.u2net/EDSR_x4.pb || curl -sSL -o ~/.u2net/EDSR_x4.pb https://raw.githubusercontent.com/Saafke/EDSR_Tensorflow/master/models/EDSR_x4.pb

      - name: Normalize avatars
        env:
          # optional repository secret: lets the job fetch a fresh profile picture
          # for submissions that were saved without one
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python scripts/build_data.py
          python scripts/avatars/auto.py --sr-model ~/.u2net/EDSR_x4.pb
          python scripts/build_data.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/avatars scripts/avatars/avatars.json data/avatars/source src/data/generated
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Normalize avatars for user-added characters"
          git push
